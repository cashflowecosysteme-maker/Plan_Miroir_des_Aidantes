<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal de Réflexion — NyXia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root { --p:#7B5CFF; --p2:#5A6CFF; --p3:#a78bfa; --gold:#F4C842; }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { min-height:100%; background:#060a18; font-family:'Outfit',sans-serif; color:#fff; }
    body { padding-bottom:60px; }

    .bg {
      position:fixed; inset:0; z-index:0;
      background:
        radial-gradient(ellipse 80% 60% at 40% 0%, rgba(50,15,110,0.5) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 20%, rgba(30,10,80,0.3) 0%, transparent 60%),
        #060a18;
    }
    .particles { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
    .particle { position:absolute; border-radius:50%; opacity:0; animation:floatUp linear infinite; }
    @keyframes floatUp {
      0% { opacity:0; transform:translateY(0) scale(0); }
      10% { opacity:0.5; } 90% { opacity:0.15; }
      100% { opacity:0; transform:translateY(-100vh) scale(1.5); }
    }

    .scene { position:relative; z-index:2; display:flex; flex-direction:row-reverse; align-items:flex-start; }

    /* ─── NyXia en grand format, fixée sur le côté ─── */
    .nyxia-side {
      position:sticky; top:0; flex-shrink:0; width:380px; height:100vh;
      display:flex; align-items:center; justify-content:center;
      animation:nyxiaIn 1.2s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes nyxiaIn { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:none; } }
    .nyxia-glow {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:340px; height:440px;
      background:radial-gradient(ellipse 70% 80% at 50% 50%,
        rgba(100,60,200,0.5) 0%, rgba(123,92,255,0.25) 35%, rgba(60,20,120,0.1) 60%, transparent 75%);
      filter:blur(28px); animation:glowPulse 3.5s ease-in-out infinite; z-index:1;
    }
    @keyframes glowPulse { 0%,100% { opacity:0.75; transform:translate(-50%,-50%) scale(1); } 50% { opacity:1; transform:translate(-50%,-50%) scale(1.06); } }
    .nyxia-floor-glow {
      position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
      width:220px; height:30px;
      background:radial-gradient(ellipse 100% 100% at 50% 50%, rgba(100,60,200,0.5), transparent 70%);
      filter:blur(14px); border-radius:50%; z-index:0; animation:glowPulse 3.5s ease-in-out infinite;
    }
    .nyxia-img {
      position:relative; z-index:2; height:66vh; max-height:600px; object-fit:contain;
      filter:drop-shadow(0 0 40px rgba(100,60,200,0.55)) drop-shadow(0 0 80px rgba(123,92,255,0.2));
      animation:nyxiaFloat 4.5s ease-in-out infinite;
    }
    @keyframes nyxiaFloat { 0%,100% { transform:translateY(0px); } 50% { transform:translateY(-12px); } }

    .content-side { flex:1; min-width:0; max-width:680px; padding:36px 40px 0 24px; }

    .eyebrow { font-size:10px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:var(--p3); margin-bottom:6px; opacity:0.85; }
    .title { font-family:'Cormorant Garamond',serif; font-size:clamp(26px,4vw,36px); font-weight:300; color:#fff; margin-bottom:26px; animation:fadeDown 1s ease both; }
    @keyframes fadeDown { from { opacity:0; transform:translateY(-14px); } to { opacity:1; transform:none; } }
    .title em { font-style:italic; background:linear-gradient(135deg,#c4b5fd,var(--p3),#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

    /* ─── Barre d'actions ─── */
    .toolbar {
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:30px;
      animation:fadeDown 1s ease 0.1s both;
    }
    .btn-glass-sm {
      display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:50px;
      font-family:'Outfit',sans-serif; font-size:13px; font-weight:600; color:#fff; cursor:pointer;
      border:1px solid rgba(163,139,250,0.35); background:rgba(100,60,200,0.12);
      backdrop-filter:blur(16px); transition:all 0.3s ease; white-space:nowrap;
    }
    .btn-glass-sm:hover { background:rgba(100,60,200,0.24); border-color:rgba(196,181,253,0.6); transform:translateY(-1px); }
    .btn-glass-sm.gold { border-color:rgba(244,200,66,0.4); }
    .btn-glass-sm.gold:hover { background:rgba(244,200,66,0.14); border-color:var(--gold); }
    select.period-select {
      background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); color:var(--text,#e2e8f0);
      padding:10px 14px; border-radius:50px; font-family:'Outfit',sans-serif; font-size:12px; cursor:pointer; outline:none;
    }

    /* ─── Formulaire de saisie manuelle ─── */
    .entry-form {
      max-height:0; overflow:hidden; transition:max-height 0.4s ease, margin 0.4s ease;
      background:rgba(15,28,63,0.5); border:1px solid rgba(123,92,255,0.2); border-radius:16px;
    }
    .entry-form.open { max-height:520px; margin-bottom:30px; }
    .entry-form-inner { padding:22px; }
    .entry-form label { font-size:11px; color:var(--p3); text-transform:uppercase; letter-spacing:1.5px; display:block; margin-bottom:6px; }
    .entry-form textarea {
      width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:10px;
      padding:12px 14px; color:#fff; font-family:'Outfit',sans-serif; font-size:14px; resize:none; outline:none;
      margin-bottom:16px; transition:border-color 0.2s;
    }
    .entry-form textarea:focus { border-color:var(--p); }
    #formExercice { height:70px; }
    #formNote { height:70px; }
    .entry-form-actions { display:flex; gap:10px; justify-content:flex-end; }
    .btn-cancel { background:transparent; border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.6); padding:10px 18px; border-radius:50px; font-size:13px; cursor:pointer; }
    .btn-save { background:linear-gradient(135deg,var(--p),var(--p2)); border:none; color:#fff; padding:10px 22px; border-radius:50px; font-size:13px; font-weight:600; cursor:pointer; }

    /* ─── Constellation / Ligne du temps ─── */
    .constellation { position:relative; padding-left:26px; }
    .constellation::before {
      content:''; position:absolute; left:9px; top:6px; bottom:6px; width:1px;
      background:linear-gradient(to bottom, rgba(163,139,250,0.5), rgba(163,139,250,0.08));
    }
    .entry-star { position:relative; margin-bottom:22px; animation:starIn 0.5s ease both; }
    @keyframes starIn { from { opacity:0; transform:translateX(-8px); } to { opacity:1; transform:none; } }
    .star-dot {
      position:absolute; left:-26px; top:6px; width:11px; height:11px; border-radius:50%;
      background:radial-gradient(circle, #fff, var(--p3)); box-shadow:0 0 10px rgba(163,139,250,0.9), 0 0 20px rgba(123,92,255,0.5);
      cursor:pointer; z-index:2;
    }
    .star-dot.source-chat { background:radial-gradient(circle, #fff, var(--gold)); box-shadow:0 0 10px rgba(244,200,66,0.9), 0 0 20px rgba(244,200,66,0.5); }
    .entry-card {
      background:rgba(15,28,63,0.45); border:1px solid rgba(255,255,255,0.07); border-radius:14px;
      padding:16px 18px; cursor:pointer; transition:all 0.25s ease;
    }
    .entry-card:hover { border-color:rgba(123,92,255,0.35); background:rgba(15,28,63,0.65); }
    .entry-meta { display:flex; align-items:center; gap:8px; font-size:11px; color:rgba(214,217,240,0.5); margin-bottom:6px; }
    .entry-source-tag { font-size:10px; padding:2px 8px; border-radius:20px; background:rgba(123,92,255,0.15); color:#c4b5ff; }
    .entry-source-tag.chat { background:rgba(244,200,66,0.15); color:var(--gold); }
    .entry-preview { font-size:13.5px; color:rgba(255,255,255,0.85); line-height:1.5; }
    .entry-preview.truncate { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .entry-full { display:none; margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.06); }
    .entry-card.expanded .entry-full { display:block; }
    .entry-card.expanded .entry-preview { -webkit-line-clamp:unset; }
    .entry-note-block { margin-top:10px; padding:10px 12px; background:rgba(244,200,66,0.05); border-left:2px solid var(--gold); border-radius:6px; font-size:13px; color:rgba(255,255,255,0.75); }
    .entry-actions { display:flex; gap:8px; margin-top:12px; }
    .entry-action-btn {
      font-size:11px; padding:5px 12px; border-radius:20px; border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.02); color:rgba(214,217,240,0.7); cursor:pointer; transition:all 0.15s;
    }
    .entry-action-btn:hover { border-color:var(--p3); color:#fff; }
    .entry-action-btn.danger:hover { border-color:#ef4444; color:#ef4444; }

    .empty-state {
      text-align:center; padding:60px 20px; color:rgba(214,217,240,0.5); font-size:14px; font-style:italic;
    }

    .toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
      background:rgba(15,28,63,0.95); border:1px solid var(--p); color:#fff; padding:10px 22px;
      border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:all 0.3s ease; z-index:20;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    @media(max-width:600px) {
      .scene { flex-direction:column; }
      .nyxia-side { position:relative; width:100%; height:38vh; top:0; }
      .nyxia-img { height:34vh; }
      .content-side { max-width:100%; padding:24px 16px 0; }
      .toolbar { gap:8px; }
      .btn-glass-sm { padding:9px 16px; font-size:12px; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="particles" id="particles"></div>

  <div class="scene">
    <div class="nyxia-side">
      <div class="nyxia-glow"></div>
      <div class="nyxia-floor-glow"></div>
      <img src="/NyXia - Journal de Réflexion transparent.png" alt="NyXia — Journal de Réflexion" class="nyxia-img">
    </div>

    <div class="content-side">
      <div class="eyebrow">📖 Espace d'Intégration</div>
      <h1 class="title">Journal de <em>Réflexion</em></h1>

      <div class="toolbar">
        <button class="btn-glass-sm" onclick="toggleForm()">✍️ Nouvelle entrée</button>
        <button class="btn-glass-sm gold" onclick="exporterCarnet()">📄 Exporter mon carnet (PDF)</button>
        <select class="period-select" id="periodSelect" onchange="renderConstellation()">
          <option value="all">Toutes les entrées</option>
          <option value="month">Ce mois-ci</option>
        </select>
      </div>

      <div class="entry-form" id="entryForm">
        <div class="entry-form-inner">
          <label>Exercice proposé par NyXia (ou reçu ailleurs)</label>
          <textarea id="formExercice" placeholder="Note ici l'exercice que tu veux garder..."></textarea>
          <label>Ta réflexion personnelle</label>
          <textarea id="formNote" placeholder="Comment ça résonne pour toi, ce que tu en retiens..."></textarea>
          <div class="entry-form-actions">
            <button class="btn-cancel" onclick="toggleForm()">Annuler</button>
            <button class="btn-save" onclick="sauvegarderEntreeManuelle()">💾 Déposer dans mon journal</button>
          </div>
        </div>
      </div>

      <div class="constellation" id="constellation">
        <div class="empty-state">Chargement de ton journal...</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const container = document.getElementById('particles');
    const colors = ['#c4b5fd','#a78bfa','#7B5CFF','#e9d5ff','#ffffff'];
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 2.5 + 0.8;
      p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;bottom:${Math.random()*-20}%;animation-duration:${Math.random()*14+9}s;animation-delay:${Math.random()*12}s;`;
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      container.appendChild(p);
    }

    const sessionToken = sessionStorage.getItem('nyxia_token') || '';
    let toutesLesEntrees = [];

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function toggleForm() {
      document.getElementById('entryForm').classList.toggle('open');
    }

    function formatDate(ts) {
      const d = new Date(ts);
      return d.toLocaleDateString('fr-CA', { day:'2-digit', month:'long', year:'numeric' }) + ' · ' + d.toLocaleTimeString('fr-CA', { hour:'2-digit', minute:'2-digit' });
    }

    async function sauvegarderEntreeManuelle() {
      const exercice = document.getElementById('formExercice').value.trim();
      const note = document.getElementById('formNote').value.trim();
      if (!exercice && !note) { showToast('Écris au moins une chose avant de déposer.'); return; }
      if (!sessionToken) { showToast('Session introuvable — retourne au tableau de bord.'); return; }

      try {
        const response = await fetch('/api/reflexion/save', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: sessionToken, entry: { exercice, note, source: 'manuel' } })
        });
        const data = await response.json();
        if (data.success) {
          document.getElementById('formExercice').value = '';
          document.getElementById('formNote').value = '';
          toggleForm();
          showToast('✦ Déposé dans ton journal');
          chargerJournal();
        } else {
          showToast('Impossible de sauvegarder pour le moment.');
        }
      } catch (e) {
        showToast('Erreur de connexion.');
      }
    }

    async function supprimerEntree(id) {
      if (!sessionToken) return;
      try {
        await fetch('/api/reflexion/delete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: sessionToken, id })
        });
        showToast('Entrée retirée du journal');
        chargerJournal();
      } catch (e) {
        showToast('Erreur de connexion.');
      }
    }

    function estDansLeMois(ts) {
      const d = new Date(ts), now = new Date();
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }

    function renderConstellation() {
      const period = document.getElementById('periodSelect').value;
      const el = document.getElementById('constellation');
      const entries = period === 'month' ? toutesLesEntrees.filter(e => estDansLeMois(e.date)) : toutesLesEntrees;

      if (!entries.length) {
        el.innerHTML = '<div class="empty-state">✦ Ton journal est encore vierge pour cette période.<br>Dépose ta première réflexion avec le bouton ci-dessus.</div>';
        return;
      }

      el.innerHTML = entries.map(e => {
        const isChat = e.source === 'chat';
        const exerciceTxt = (e.exercice || '').replace(/</g, '&lt;');
        const noteTxt = (e.note || '').replace(/</g, '&lt;');
        return '<div class="entry-star">' +
          '<div class="star-dot ' + (isChat ? 'source-chat' : '') + '"></div>' +
          '<div class="entry-card" id="card-' + e.id + '" onclick="toggleCard(\'' + e.id + '\')">' +
            '<div class="entry-meta">' +
              '<span>' + formatDate(e.date) + '</span>' +
              '<span class="entry-source-tag ' + (isChat ? 'chat' : '') + '">' + (isChat ? '💬 depuis NyXia' : '✍️ manuel') + '</span>' +
            '</div>' +
            (exerciceTxt ? '<div class="entry-preview truncate">' + exerciceTxt + '</div>' : '') +
            '<div class="entry-full">' +
              (exerciceTxt ? '' : '') +
              (noteTxt ? '<div class="entry-note-block">' + noteTxt + '</div>' : '') +
              '<div class="entry-actions">' +
                '<button class="entry-action-btn" onclick="event.stopPropagation(); genererPDFEntree(\'' + e.id + '\')">📄 Fiche PDF</button>' +
                '<button class="entry-action-btn danger" onclick="event.stopPropagation(); supprimerEntree(\'' + e.id + '\')">🗑️ Retirer</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function toggleCard(id) {
      const card = document.getElementById('card-' + id);
      if (card) card.classList.toggle('expanded');
    }

    async function chargerJournal() {
      const el = document.getElementById('constellation');
      if (!sessionToken) {
        el.innerHTML = '<div class="empty-state">Session requise pour afficher ton journal.</div>';
        return;
      }
      try {
        const response = await fetch('/api/reflexion/list', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: sessionToken })
        });
        const data = await response.json();
        toutesLesEntrees = (data && data.entries) || [];
        renderConstellation();
      } catch (e) {
        el.innerHTML = '<div class="empty-state">Impossible de charger ton journal.</div>';
      }
    }

    /* ─── PDF individuel ─── */
    function genererPDFEntree(id) {
      const entry = toutesLesEntrees.find(e => e.id === id);
      if (!entry) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:'mm', format:'a4' });
      doc.setFillColor(10,22,40); doc.rect(0,0,210,297,'F');
      doc.setTextColor(244,200,66); doc.setFontSize(18);
      doc.text('NyXia — Journal de Réflexion', 20, 25);
      doc.setTextColor(148,163,184); doc.setFontSize(10);
      doc.text(formatDate(entry.date), 20, 33);
      doc.setDrawColor(123,92,255); doc.line(20,38,190,38);

      let y = 50;
      const cleanTxt = (t) => (t || '').replace(/[✦💜🚀💎🌐📱⭐✓►▶🪄🌙💧🧠🕯️📖✍️💬]/g, '');
      if (entry.exercice) {
        doc.setTextColor(196,181,253); doc.setFontSize(11); doc.text('Exercice', 20, y); y += 7;
        doc.setTextColor(226,232,240); doc.setFontSize(11);
        const lignes = doc.splitTextToSize(cleanTxt(entry.exercice), 170);
        doc.text(lignes, 20, y); y += lignes.length * 6 + 10;
      }
      if (entry.note) {
        doc.setTextColor(244,200,66); doc.setFontSize(11); doc.text('Ma réflexion', 20, y); y += 7;
        doc.setTextColor(226,232,240); doc.setFontSize(11);
        const lignesNote = doc.splitTextToSize(cleanTxt(entry.note), 170);
        doc.text(lignesNote, 20, y);
      }
      doc.setTextColor(148,163,184); doc.setFontSize(8);
      doc.text('© NyXia IA — Créée par Diane Boyer', 20, 285);
      doc.save('NyXia-Journal-' + entry.id.slice(0,8) + '.pdf');
      showToast('📄 Fiche téléchargée');
    }

    /* ─── PDF carnet groupé ─── */
    function exporterCarnet() {
      const period = document.getElementById('periodSelect').value;
      const entries = period === 'month' ? toutesLesEntrees.filter(e => estDansLeMois(e.date)) : toutesLesEntrees;
      if (!entries.length) { showToast('Aucune entrée à exporter.'); return; }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:'mm', format:'a4' });
      const cleanTxt = (t) => (t || '').replace(/[✦💜🚀💎🌐📱⭐✓►▶🪄🌙💧🧠🕯️📖✍️💬]/g, '');

      // Page couverture
      doc.setFillColor(6,10,24); doc.rect(0,0,210,297,'F');
      doc.setTextColor(244,200,66); doc.setFontSize(26);
      doc.text('Mon Carnet de', 105, 130, { align:'center' });
      doc.text('Réflexion', 105, 145, { align:'center' });
      doc.setTextColor(196,181,253); doc.setFontSize(12);
      doc.text(period === 'month' ? 'Ce mois-ci' : 'Toutes les entrées', 105, 160, { align:'center' });
      doc.setTextColor(148,163,184); doc.setFontSize(9);
      doc.text('NyXia IA — Créée par Diane Boyer', 105, 270, { align:'center' });

      entries.slice().reverse().forEach((entry) => {
        doc.addPage();
        doc.setFillColor(10,22,40); doc.rect(0,0,210,297,'F');
        doc.setTextColor(244,200,66); doc.setFontSize(13);
        doc.text(formatDate(entry.date), 20, 22);
        doc.setDrawColor(123,92,255); doc.line(20,27,190,27);

        let y = 40;
        if (entry.exercice) {
          doc.setTextColor(196,181,253); doc.setFontSize(11); doc.text('Exercice', 20, y); y += 7;
          doc.setTextColor(226,232,240); doc.setFontSize(11);
          const lignes = doc.splitTextToSize(cleanTxt(entry.exercice), 170);
          doc.text(lignes, 20, y); y += lignes.length * 6 + 10;
        }
        if (entry.note) {
          doc.setTextColor(244,200,66); doc.setFontSize(11); doc.text('Ma réflexion', 20, y); y += 7;
          doc.setTextColor(226,232,240); doc.setFontSize(11);
          const lignesNote = doc.splitTextToSize(cleanTxt(entry.note), 170);
          doc.text(lignesNote, 20, y);
        }
      });

      doc.save('NyXia-Carnet-Reflexion.pdf');
      showToast('📄 Carnet téléchargé (' + entries.length + ' entrées)');
    }

    chargerJournal();
  </script>
</body>
</html>
