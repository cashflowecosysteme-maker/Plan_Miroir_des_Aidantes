name = "nyxia"
compatibility_date = "2024-01-01"

# ═══════════════════════════════════════════════════════
# NYXIA — Cloudflare Pages (Advanced Mode)
# ═══════════════════════════════════════════════════════
# Le fichier _worker.js à la racine gère TOUT :
#   - Routes /api/* → logique Worker (auth, chat, admin)
#   - Tout le reste → fichiers statiques (HTML, images, CSS, JS)
#
# DÉPLOIEMENT :
#   1. wrangler kv:namespace create "NYXIA_KV"   (si pas déjà fait)
#   2. Collez l'ID dans le binding ci-dessous
#   3. wrangler pages deploy . --project-name=nyxia
#   4. wrangler secret put OPENROUTER_API_KEY
# ═══════════════════════════════════════════════════════

# KV Namespace — Stockage des comptes, sessions, données
[[kv_namespaces]]
binding = "NYXIA_KV"
id = "9ada61c24ee0425899c14832a6be01e2"

# ═══════════════════════════════════════════════════════
# SECRETS — Ne JAMAIS les mettre ici !
# Définissez-les avec :
#   wrangler secret put OPENROUTER_API_KEY
#   wrangler secret put ADMIN_PASSWORD
# ═══════════════════════════════════════════════════════

# Variables non secrètes (optionnel)
# [vars]
# ADMIN_PASSWORD = "votre_mot_de_passe_admin"
